[project]
name = "renfe-bot"
version = "0.3.0-beta"
requires-python = ">= 3.12"
dependencies = [
    "aiohttp>=3.12.0",
    "dateparser>=1.2.1",
    "json5>=0.12.0",
    "pydantic>=2.11.7",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "python-dotenv>=1.0.1",
    "pytelegrambotapi>=4.24.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "telebot>=0.0.5",
    "thefuzz>=0.22.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
