services:
  renfe-bot:
    image: ghcr.io/adrianfl55/renfe-bot:latest
    build: .
    container_name: renfe-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    env_file:
      - path: .env
        required: false
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
